name: Daily Football Simulations

concurrency:
  group: football-simulations
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 3 * * *'   # Run daily at 03:30 UTC (04:30 UK time / 05:30 CEST during BST)
    - cron: '0 13 * * *'   # Second run at 13:00 UTC: picks up results the feed hadn't published by the first run
  workflow_dispatch:

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3️⃣.5 Install Playwright's headless Chromium (pip install alone only
      # gets the Python package, not the browser binary + OS deps it drives)
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # 4️⃣ Prepare folders
      - name: Prepare folders
        run: |
          mkdir -p data/simulations
          mkdir -p logs

      # 5️⃣ Run simulations and capture logs
      - name: Run simulations
        env:
          ODDS_DATA_API_KEY: ${{ secrets.ODDS_DATA_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Running simulations at $(date -u +"%Y-%m-%d_%H%M%S_UTC")"
          python -u precompute_simulations.py 2>&1 | tee logs/github_actions_run.log

      # 6️⃣ Update redeploy trigger
      - name: Update redeploy trigger
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > data/last_updated.txt

      # 7️⃣ Commit and push updated simulation data
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git commit -m "Update precomputed simulations [skip ci]" || echo "No changes to commit"

          # The simulation run + Playwright install take several minutes, so
          # main can move in the meantime (e.g. a manual push landing mid-run)
          # -- a plain push then gets rejected as non-fast-forward. Rebase
          # onto the latest main and retry rather than fail the whole job.
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              success=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying..."
            sleep $((5 + RANDOM % 10))
          done

          if [ "$success" != "true" ]; then
            echo "::error::Failed to push updated data after multiple attempts"
            exit 1
          fi

      # 8️⃣ Flag leagues whose results are behind the table: a warning while
      # the feed catches up (the next run fetches again), a failed run (GitHub
      # emails the owner) once a league has been behind for 24 hours. Runs
      # after the commit, so everything that did update is still published.
      - name: Check results are complete
        run: |
          failed=0
          if [ -f logs/results_annotations.txt ]; then
            while IFS=$'\t' read -r level msg; do
              echo "::$level::$msg"
              [ "$level" = "error" ] && failed=1
            done < logs/results_annotations.txt
          fi
          exit $failed

      # 9️⃣ Upload logs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-log
          path: logs/github_actions_run.log